{% extends "base.html" %}
{% block title %}Check your email | InsightForge AI{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Check your email</h2>
        <p class="auth-subtitle">
            If an account exists with that email address, we have sent instructions for resetting your password.
        </p>
        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
